# BETK CI — .github/workflows/ci.yml
# Runs on every PR to develop/main and on direct pushes to those branches.
# Stages are sequential and block on failure (each job `needs` the prior).
#
# Stage order per CICD_PIPELINE.md:
#   install → lint → typecheck → vitest (unit) → guards → types-drift → build
#
# Integration tests (tests/integration/rls.smoke.test.ts) hit live staging and
# create/teardown auth users — they MUST NOT run in the default CI job silently.
# They are gated behind the separate `rls-smoke` job, which only runs when
# triggered on develop push or workflow_dispatch, and fails loudly when secrets
# are absent.

name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ─────────────────────────────────────────────────────────────────────────────
# Shared setup — run once, cache node_modules for all downstream jobs.
# Every job that needs node_modules must list `install` in its direct `needs`
# so that `needs.install.outputs.cache-key` is accessible.
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  install:
    name: Install
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.cache-key.outputs.key }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Generate cache key
        id: cache-key
        run: echo "key=node-modules-${{ hashFiles('pnpm-lock.yaml') }}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/cache/save@v4
        with:
          path: node_modules
          key: ${{ steps.cache-key.outputs.key }}

  # ─── Stage 2: lint ────────────────────────────────────────────────────────
  lint:
    name: Lint
    needs: [install]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: ${{ needs.install.outputs.cache-key }}
      - name: Lint
        run: pnpm lint

  # ─── Stage 3: typecheck ───────────────────────────────────────────────────
  typecheck:
    name: Typecheck
    needs: [install]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: ${{ needs.install.outputs.cache-key }}
      - name: Typecheck
        run: pnpm typecheck

  # ─── Stage 4: vitest (unit only) ──────────────────────────────────────────
  # Integration tests (tests/integration/) hit live staging and are gated
  # behind the separate `rls-smoke` job.  The unit suite may be empty until
  # Phase 02+ adds the first unit tests — --passWithNoTests handles that case.
  #
  # The three REQUIRED vars (NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY,
  # SUPABASE_SERVICE_KEY) are provided as obvious dummies so configs/env.ts doesn't
  # throw at import time when unit tests transitively import app modules.
  # tests/setup/env.ts also backfills these as placeholders (lower priority —
  # real values from .env.local or these job-level vars take precedence).
  vitest:
    name: Vitest (unit)
    needs: [install, lint, typecheck]
    runs-on: ubuntu-latest
    env:
      # Required trio — dummy values keep the strict Zod loader happy.
      # No real Supabase project is contacted during unit tests.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key-ci-unit
      SUPABASE_SERVICE_KEY: dummy-service-key-ci-unit
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: ${{ needs.install.outputs.cache-key }}
      - name: Unit tests (integration excluded)
        run: pnpm test:unit

  # ─── Stage 4 (parallel): guards ───────────────────────────────────────────
  # Guard scripts are pure Node.js (built-in modules only — no npm packages,
  # no configs/env.ts import).  They only need a checkout + Node.js, which is
  # always present on ubuntu-latest.  No pnpm/node_modules setup needed.
  guards:
    name: Guards
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Guard A: no client/RSC-reachable code may import the service-role client
      - name: Guard — service-role import isolation
        run: node scripts/check-service-import.mjs

      # Guard B: every action/API file that queries Supabase must import a Zod schema
      - name: Guard — Zod coverage in actions + API routes
        run: node scripts/check-zod-coverage.mjs

  # ─── Stage 5: types-drift ─────────────────────────────────────────────────
  # Requires GitHub secrets: SUPABASE_PROJECT_REF + SUPABASE_ACCESS_TOKEN.
  # Fails LOUDLY if either is absent — a silent skip would allow stale types to merge.
  types-drift:
    name: Types drift
    needs: [install, vitest, guards]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: ${{ needs.install.outputs.cache-key }}

      - name: Verify Supabase secrets are present
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          missing=()
          [ -z "$SUPABASE_PROJECT_REF" ]   && missing+=("SUPABASE_PROJECT_REF")
          [ -z "$SUPABASE_ACCESS_TOKEN" ]  && missing+=("SUPABASE_ACCESS_TOKEN")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Types-drift check requires GitHub secrets: ${missing[*]}"
            echo "::error::Add them under Settings → Secrets and variables → Actions."
            echo "::error::A silent skip would allow stale types to merge — failing explicitly."
            exit 1
          fi
          echo "Secrets present — proceeding with types-drift check."

      - name: Regenerate types from live schema
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          pnpm exec supabase gen types typescript \
            --project-id "$SUPABASE_PROJECT_REF" \
            --schema betk,betk_analytics \
            > src/lib/supabase/types.ts

      - name: Fail if committed types differ from live schema
        run: |
          if ! git diff --exit-code src/lib/supabase/types.ts; then
            echo "::error::src/lib/supabase/types.ts is stale."
            echo "::error::Run \`pnpm db:types\` locally, review the diff, and commit the updated file."
            exit 1
          fi
          echo "Types are in sync with the live schema."

  # ─── Stage 6: build ───────────────────────────────────────────────────────
  build:
    name: Build
    needs: [install, types-drift]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: ${{ needs.install.outputs.cache-key }}
      - name: Build
        env:
          # Build needs env vars — use CI placeholders. Real values live in
          # Vercel and are injected at deploy time.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY || 'phc_ci_placeholder' }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ secrets.NEXT_PUBLIC_POSTHOG_HOST || 'https://posthog.invalid' }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN || 'https://ci@ci.ingest.sentry.io/1' }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN || 'https://ci@ci.ingest.sentry.io/1' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY || 're_ci_placeholder' }}
          RESEND_FROM_ADDRESS: ${{ secrets.RESEND_FROM_ADDRESS || 'noreply@betk.invalid' }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID || 'ci-client-id' }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET || 'ci-client-secret' }}
          WHATSAPP_API_TOKEN: ${{ secrets.WHATSAPP_API_TOKEN || 'ci-whatsapp-token' }}
          WHATSAPP_PHONE_ID: ${{ secrets.WHATSAPP_PHONE_ID || 'ci-phone-id' }}
          SMS_PROVIDER_KEY: ${{ secrets.SMS_PROVIDER_KEY || 'ci-sms-key' }}
          SUPABASE_DOCS_BUCKET: ${{ secrets.SUPABASE_DOCS_BUCKET || 'seller-documents' }}
          SUPABASE_MEDIA_BUCKET: ${{ secrets.SUPABASE_MEDIA_BUCKET || 'listing-media' }}
        run: pnpm build

# ─────────────────────────────────────────────────────────────────────────────
# Opt-in: RLS smoke test — runs integration tests against staging.
# INTENT: explicit, not silent. Must be triggered deliberately.
#
# Trigger options:
#   1. workflow_dispatch
#   2. Push to develop (auto, but only when secrets are configured)
#
# Requires secrets: NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY,
#                   SUPABASE_SERVICE_KEY (+ Zod-loader placeholders for env.ts)
# ─────────────────────────────────────────────────────────────────────────────
  rls-smoke:
    name: RLS smoke (opt-in, staging)
    # Only runs on workflow_dispatch or develop push — never on PRs from forks
    # (secrets are unavailable to forks; failing silently is unacceptable).
    if: >
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/develop')
    needs: [install, vitest, guards]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: ${{ needs.install.outputs.cache-key }}

      - name: Verify staging secrets are present
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          missing=()
          [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]      && missing+=("NEXT_PUBLIC_SUPABASE_URL")
          [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ] && missing+=("NEXT_PUBLIC_SUPABASE_ANON_KEY")
          [ -z "$SUPABASE_SERVICE_KEY" ]           && missing+=("SUPABASE_SERVICE_KEY")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::RLS smoke test requires secrets: ${missing[*]}"
            echo "::error::Add them under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: RLS smoke tests (staging)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Zod-loader placeholders (not used in RLS test, but env.ts validates them)
          NEXT_PUBLIC_POSTHOG_KEY: phc_ci_placeholder
          NEXT_PUBLIC_POSTHOG_HOST: https://posthog.invalid
          NEXT_PUBLIC_SENTRY_DSN: https://ci@ci.ingest.sentry.io/1
          GOOGLE_CLIENT_ID: ci-client-id
          GOOGLE_CLIENT_SECRET: ci-client-secret
          RESEND_API_KEY: re_ci_placeholder
          RESEND_FROM_ADDRESS: noreply@betk.invalid
          SENTRY_DSN: https://ci@ci.ingest.sentry.io/1
          SUPABASE_DOCS_BUCKET: seller-documents
          SUPABASE_MEDIA_BUCKET: listing-media
          WHATSAPP_API_TOKEN: ci-whatsapp-token
          WHATSAPP_PHONE_ID: ci-phone-id
          SMS_PROVIDER_KEY: ci-sms-key
        run: pnpm exec vitest run tests/integration/rls.smoke.test.ts --reporter=verbose
